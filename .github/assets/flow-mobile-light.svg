<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 982" width="420" height="982" role="img" aria-label="Data flow. Request: an agent over MCP stdio or a person on the cea CLI calls one of 20 tools from a single registry, and the input is checked against a strict schema that rejects flags which load code into the compiler. Run: the toolbox finds compilers and tools already installed on PATH and records their versions, each process is started from an argument array with no shell, a timeout and an output cap, and the real clang, gcc, opt, alive-tv, cvise, csmith or git does the work. Record: the result becomes an evidence record split into observed, inferred and unknown, it is appended to a JSONL ledger with raw output kept on disk, and the caller gets the record and its evidence id to cite later.">
<style>
.s{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.ink{fill:#111111}.mute{fill:#5F5F5F}.acc{fill:#000000}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes fade{0%,100%{opacity:0}35%,65%{opacity:1}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pulse{animation:pulse 4s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:dash 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="420" height="982" rx="3" fill="#F5F5F5"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E8E8E8" stroke-width="1"/></pattern></defs>
<rect width="420" height="982" rx="3" fill="url(#g)"/>
<path d="M24 14H14V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M396 14H406V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M24 968H14V958" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M396 968H406V958" fill="none" stroke="#5F5F5F" stroke-width="1"/>
<text x="30" y="56" class="m" font-size="11"><tspan class="acc">A</tspan><tspan class="mute" dx="10">Request</tspan></text><rect x="30" y="72" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.00s" cx="48" cy="94" r="3.2" fill="#000000"/>
<text x="62" y="98" class="m ink" font-size="12" font-weight="600">Agent or person</text>
<text x="48" y="118" class="s mute" font-size="13">MCP over stdio: cea mcp</text>
<text x="48" y="134" class="s mute" font-size="13">or cea &lt;tool&gt; --json</text><path class="flow" d="M350 144V163" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 162l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="168" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.45s" cx="48" cy="190" r="3.2" fill="#000000"/>
<text x="62" y="194" class="m ink" font-size="12" font-weight="600">Registry</text>
<text x="48" y="214" class="s mute" font-size="13">20 tools, one definition</text>
<text x="48" y="230" class="s mute" font-size="13">shared by server and CLI</text><path class="flow" d="M350 240V259" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 258l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="264" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.90s" cx="48" cy="286" r="3.2" fill="#000000"/>
<text x="62" y="290" class="m ink" font-size="12" font-weight="600">Validate</text>
<text x="48" y="310" class="s mute" font-size="13">strict zod input schema</text>
<text x="48" y="326" class="s mute" font-size="13">code-loading flags refused</text><path class="flow" d="M350 336V373" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 372l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><text x="30" y="362" class="m" font-size="11"><tspan class="acc">B</tspan><tspan class="mute" dx="10">Run</tspan></text><rect x="30" y="378" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:1.35s" cx="48" cy="400" r="3.2" fill="#000000"/>
<text x="62" y="404" class="m ink" font-size="12" font-weight="600">Toolbox</text>
<text x="48" y="424" class="s mute" font-size="13">19 providers looked up</text>
<text x="48" y="440" class="s mute" font-size="13">on PATH, with versions</text><path class="flow" d="M350 450V469" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 468l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="474" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:1.80s" cx="48" cy="496" r="3.2" fill="#000000"/>
<text x="62" y="500" class="m ink" font-size="12" font-weight="600">Exec</text>
<text x="48" y="520" class="s mute" font-size="13">argv array, no shell</text>
<text x="48" y="536" class="s mute" font-size="13">timeout and output cap</text><path class="flow" d="M350 546V565" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 564l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="570" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:2.25s" cx="48" cy="592" r="3.2" fill="#000000"/>
<text x="62" y="596" class="m ink" font-size="12" font-weight="600">Your compilers</text>
<text x="48" y="616" class="s mute" font-size="13">clang, gcc, opt, alive-tv,</text>
<text x="48" y="632" class="s mute" font-size="13">cvise, csmith, git</text><path class="flow" d="M350 642V679" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 678l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><text x="30" y="668" class="m" font-size="11"><tspan class="acc">C</tspan><tspan class="mute" dx="10">Record</tspan></text><rect x="30" y="684" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:2.70s" cx="48" cy="706" r="3.2" fill="#000000"/>
<text x="62" y="710" class="m ink" font-size="12" font-weight="600">Evidence</text>
<text x="48" y="730" class="s mute" font-size="13">observed, inferred, unknown</text>
<text x="48" y="746" class="s mute" font-size="13">commands, versions, SHA-256</text><path class="flow" d="M350 756V775" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 774l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="780" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:3.15s" cx="48" cy="802" r="3.2" fill="#000000"/>
<text x="62" y="806" class="m ink" font-size="12" font-weight="600">Ledger</text>
<text x="48" y="826" class="s mute" font-size="13">evidence.jsonl per session</text>
<text x="48" y="842" class="s mute" font-size="13">raw output kept as views</text><path class="flow" d="M350 852V871" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M346 870l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="30" y="876" width="360" height="72" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:3.60s" cx="48" cy="898" r="3.2" fill="#000000"/>
<text x="62" y="902" class="m ink" font-size="12" font-weight="600">Back to caller</text>
<text x="48" y="922" class="s mute" font-size="13">one record, one evidence id</text>
<text x="48" y="938" class="s mute" font-size="13">cited by later calls</text>
</svg>